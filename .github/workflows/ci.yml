name: Test and Lint

on: [pull_request]

jobs:
  test:
    name: Check the source code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: 'stable'

      - name: Check Flutter version
        run: flutter --version

      - name: Install packages
        run: flutter pub get

      - name: Linter
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Test web bindings in Chrome
        run: flutter test --platform chrome

  android-readiness:
    name: Android regression tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3

      - name: Setup Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: 'stable'
          # example/android's Gradle 8.10.2 is below newer Flutter's 8.14+ minimum; bump it separately.
          flutter-version: '3.44.8'

      - name: Install packages
        run: flutter pub get

      - name: Install example packages
        working-directory: example
        run: flutter pub get

      # gradlew and local.properties are gitignored; this generates them.
      - name: Generate Android Gradle files
        working-directory: example
        run: flutter build apk --config-only

      # Target the regression suites: AmplitudeFlutterPluginTest has a broken
      # fixture (JSONObject cast to Map in getConfiguration) and fails on main.
      - name: Run Android regression tests
        working-directory: example/android
        run: ./gradlew :amplitude_flutter:testDebugUnitTest --tests '*ReadinessTest' --tests '*EpochTest' --console=plain

      - name: Summarize Android regression tests
        if: always()
        run: |
          results=$(find . -path '*/test-results/testDebugUnitTest/*.xml')
          if [ -z "$results" ]; then
            echo "No test results found"
            exit 1
          fi
          tests=$(grep -ho '<testsuite [^>]*' $results | grep -o ' tests="[0-9]*"' | grep -o '[0-9]*' | paste -sd+ - | bc)
          failures=$(grep -ho '<testsuite [^>]*' $results | grep -o ' failures="[0-9]*"' | grep -o '[0-9]*' | paste -sd+ - | bc)
          echo "$tests tests completed, $failures failed" | tee -a "$GITHUB_STEP_SUMMARY"

  ios-unit-test:
    name: iOS plugin unit tests
    runs-on: macos-26
    # A run takes about 10 minutes; without a limit a hung simulator holds the macOS runner for 6 hours.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3

      - name: Set Xcode 26.6
        run: sudo xcode-select -switch /Applications/Xcode_26.6.app

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: 'stable'
          flutter-version: '3.47.9'
          cache: true

      # The plugin integrates via CocoaPods (podspec + Podfile). Newer Flutter
      # enables Swift Package Manager by default, which fails on this project
      # with a package-identity mismatch. Force the CocoaPods path.
      - name: Use CocoaPods (disable Swift Package Manager)
        run: flutter config --no-enable-swift-package-manager

      - name: Install packages
        working-directory: example
        run: flutter pub get

      # Download the iOS engine artifacts (Flutter.xcframework) that the Runner
      # project links against via $(FLUTTER_ROOT).
      - name: Precache iOS artifacts
        run: flutter precache --ios

      # Generates ios/Flutter/Generated.xcconfig (defines FLUTTER_ROOT) without a build.
      - name: Generate iOS build config
        working-directory: example
        run: flutter build ios --config-only --no-codesign --no-pub

      - name: Install CocoaPods
        working-directory: example/ios
        run: pod install

      # Boot before xcodebuild so a slow or failed boot is retried and
      # reported here rather than stalling the test step.
      - name: Boot iOS simulator
        id: simulator
        uses: amplitude/actions/simulator-action@820754f06b23ec4138c65c07dae4131a46011020 # v0
        with:
          model: 'iPhone 17'
          os: 'iOS'
          os_version: '^26'
          wait_for_boot: true
          shutdown_after_job: true

      - name: Run plugin unit tests
        working-directory: example/ios
        run: |
          xcodebuild test \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -resultBundlePath "$RUNNER_TEMP/ios-unit-tests.xcresult" \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Summarize iOS unit tests
        if: always()
        run: |
          results="$RUNNER_TEMP/ios-unit-tests.xcresult"
          if [ ! -d "$results" ]; then
            echo "No test results found"
            exit 1
          fi
          xcrun xcresulttool get test-results summary --path "$results" --compact \
            | jq -r '"\(.passedTests) passed, \(.failedTests) failed, \(.skippedTests) skipped (\(.result))"' \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload iOS test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-unit-tests-xcresult
          path: ${{ runner.temp }}/ios-unit-tests.xcresult
          if-no-files-found: ignore
